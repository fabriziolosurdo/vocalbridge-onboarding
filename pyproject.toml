[project]
name = "vocalbridge-onboarding"
version = "1.0.0"
description = "Onboarding automatico dei clienti VocalBridge: dati estratti dal sito e dalla scheda Google, sempre con la fonte"
requires-python = ">=3.11"
dependencies = ["requests>=2.32", "beautifulsoup4>=4.12", "lxml>=5.0", "pydantic>=2.6"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools]
packages = ["onboarding"]

[tool.setuptools.package-data]
onboarding = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
